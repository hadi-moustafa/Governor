name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Check gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
        # Redis/Postgres integration tests (internal/budget,
        # internal/ledger) self-skip unless GOVERNOR_TEST_REDIS_ADDR /
        # GOVERNOR_TEST_POSTGRES_DSN are set, so this doesn't need
        # services wired up here.

  # golangci-lint is deliberately not wired up yet: as of this workflow,
  # its "latest" release is built with go1.24, and this module's
  # dependencies already require go1.25 (verified by `go mod tidy`) —
  # golangci-lint can't analyze code targeting a newer language version
  # than the compiler it was itself built with. This isn't a config
  # mistake, it's confirmed upstream lag; re-add a lint job once
  # golangci-lint ships a build compiled with go1.25+. gofmt + go vet in
  # the test job above are the real static-analysis gate until then.
